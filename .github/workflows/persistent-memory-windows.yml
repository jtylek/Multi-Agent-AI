name: Persistent memory Windows verification
on:
  push:
    branches: [feature/persistent-memory-m1]
  pull_request:
    paths:
      - 'src/multi_agent_ai/memory/**'
      - 'src/multi_agent_ai/memory_cli.py'
      - 'src/multi_agent_ai/cli.py'
      - 'tests/test_memory*.py'
      - '.github/workflows/persistent-memory-windows.yml'
jobs:
  memory-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run memory tests
        run: python -m pytest -q tests/test_memory_store.py tests/test_memory_cli.py tests/test_memory_policy.py
      - name: Run complete test suite
        run: python -m pytest -q
