name: Build Windows installer

on:
  push:
    branches: [feature/m1-provider-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q

  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\Multi-Agent-AI-Setup.exe)) { throw 'Windows installer was not produced' }
          & dist\Multi-Agent-AI\Multi-Agent-AI.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI did not start' }
          Get-FileHash dist\Multi-Agent-AI-Setup.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Agent-AI-Windows-Setup
          path: dist/Multi-Agent-AI-Setup.exe
          if-no-files-found: error
          retention-days: 14
